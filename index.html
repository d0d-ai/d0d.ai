<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dOd — the next big analytics platform</title>
<meta name="description" content="dOd is building the next big analytics platform. We're in stealth mode.">
<meta property="og:title" content="dOd — the next big analytics platform">
<meta property="og:description" content="We're building the next big analytics platform. In stealth mode, for now.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1320'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%237FA0FF' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root { --bg: #0B0F19; --line: #262F45; --fg: #F1EFE9; --soft: #B9C0D0; --muted: #8A93A8; --accent: #7FA0FF; --good: #6FCF97; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 16px/1.6 "IBM Plex Sans", system-ui, sans-serif; }
  .wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; height: 64px; }
  .logo { font: 600 22px/1 "JetBrains Mono", monospace; color: var(--fg); letter-spacing: -0.02em; }
  .logo b { color: var(--accent); font-weight: 600; }
  main { flex: 1; display: flex; align-items: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1 "JetBrains Mono", monospace;
             letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good);
                     animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .eyebrow::before { animation: none; } }
  h1 { font: 700 clamp(40px, 7vw, 80px)/1.05 "Space Grotesk", system-ui, sans-serif; letter-spacing: -0.03em; margin: 22px 0 20px; max-width: 14ch; }
  h1 span { color: var(--accent); }
  p { color: var(--soft); font-size: 19px; max-width: 34em; margin: 0 0 32px; }
  a.mail { color: var(--fg); font: 500 16px "JetBrains Mono", monospace; text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
  a.mail:hover { color: var(--accent); }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer .wrap { padding-top: 20px; padding-bottom: 20px; }
</style>
</head>
<body>
<header><div class="wrap"><span class="logo" aria-label="dOd">d<b>O</b>d</span></div></header>
<main>
  <div class="wrap">
    <div class="eyebrow">In stealth mode</div>
    <h1>We're building the next <span>BIG</span> analytics platform.</h1>
    <p>We're heads down and not saying much yet. Want to hear first when we do?</p>
    <a class="mail" href="mailto:hello@d0d.ai">hello@d0d.ai</a>
  </div>
</main>
<footer><div class="wrap">© <span id="year"></span> dOd · d0d.ai</div></footer>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
