<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dOd — the next big analytics platform</title>
<meta name="description" content="dOd is building the next big analytics platform. We're in stealth mode.">
<meta property="og:title" content="dOd — the next big analytics platform">
<meta property="og:description" content="We're building the next big analytics platform. In stealth mode, for now.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1320'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%237FA0FF' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root { --bg: #0B0F19; --line: #262F45; --fg: #F1EFE9; --soft: #B9C0D0; --muted: #8A93A8; --accent: #7FA0FF; --good: #6FCF97; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 16px/1.6 "IBM Plex Sans", system-ui, sans-serif; }
  .wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; height: 64px; }
  .logo { font: 600 22px/1 "JetBrains Mono", monospace; color: var(--fg); letter-spacing: -0.02em; }
  .logo b { color: var(--accent); font-weight: 600; }
  main { flex: 1; display: flex; align-items: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1 "JetBrains Mono", monospace;
             letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good);
                     animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .eyebrow::before { animation: none; } }
  h1 { font: 700 clamp(40px, 7vw, 80px)/1.05 "Space Grotesk", system-ui, sans-serif; letter-spacing: -0.03em; margin: 22px 0 20px; max-width: 14ch; }
  h1 span { color: var(--accent); }
  p { color: var(--soft); font-size: 19px; max-width: 34em; margin: 0 0 32px; }
  a.mail { color: var(--fg); font: 500 16px "JetBrains Mono", monospace; text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
  a.mail:hover { color: var(--accent); }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer .wrap { padding-top: 20px; padding-bottom: 20px; }

  .grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: center; padding: 56px 24px; }
  @media (max-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 40px; } }

  .chat { background: #141A2A; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .chat-top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line);
              font: 500 12px "JetBrains Mono", monospace; color: var(--muted); }
  .chat-top i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .chat-top span { margin-left: auto; letter-spacing: .08em; text-transform: uppercase; }
  .chat-body { height: 440px; padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.5; animation: in .3s ease-out; }
  .msg.you { align-self: flex-end; background: #2F4FD8; color: #fff; border-bottom-right-radius: 4px; }
  .msg.dod { align-self: flex-start; background: #1A2236; border: 1px solid var(--line); border-bottom-left-radius: 4px; width: 88%; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }

  .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .src { font: 500 11.5px "JetBrains Mono", monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; transition: .3s; }
  .src.on { color: var(--fg); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(127,160,255,.12); }
  .flow { list-style: none; margin: 0; padding: 0; font: 13px/1.45 "JetBrains Mono", monospace; color: var(--soft); }
  .flow li { position: relative; padding: 0 0 10px 22px; animation: in .3s ease-out; }
  .flow li::before { content: ""; position: absolute; left: 3px; top: 5px; width: 8px; height: 8px; border-radius: 50%;
                     background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .flow li:not(:last-child)::after { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px;
                     background: linear-gradient(var(--accent) 50%, transparent 0) 0 0 / 2px 8px; animation: stream .6s linear infinite; }
  .flow li.done::before { background: var(--good); animation: none; }
  .flow li b { color: var(--fg); font-weight: 500; }
  @keyframes stream { to { background-position: 0 8px; } }
  .answer { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line); animation: in .3s ease-out; }
  .answer .lead { color: var(--fg); margin-bottom: 10px; }
  .bar { display: grid; grid-template-columns: 84px 1fr 40px; align-items: center; gap: 10px; font: 12px "JetBrains Mono", monospace; color: var(--soft); margin-top: 6px; }
  .bar div { height: 8px; border-radius: 4px; background: #34528A; }
  .bar div span { display: block; height: 100%; border-radius: 4px; background: var(--accent); width: 0; transition: width .8s ease-out; }
  .typing::after { content: "▍"; animation: pulse 1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) { .msg, .flow li, .answer { animation: none; } .flow li::before, .flow li::after { animation: none; } }
  @media (max-width: 600px) {
    .grid { padding-top: 40px; padding-bottom: 40px; }
    .chat-body { height: auto; min-height: 500px; padding: 14px; gap: 10px; }
    .msg { max-width: 92%; font-size: 14.5px; }
    .msg.dod { width: 100%; max-width: 100%; padding: 12px; }
    .flow { font-size: 12px; }
    .flow li { padding-left: 20px; }
    .bar { grid-template-columns: 76px 1fr 32px; gap: 8px; font-size: 11.5px; }
  }
</style>
</head>
<body>
<header><div class="wrap"><span class="logo" aria-label="dOd">d<b>O</b>d</span></div></header>
<main>
  <div class="wrap grid">
    <div>
      <div class="eyebrow">In stealth mode</div>
      <h1>We're building the next <span>BIG</span> analytics platform.</h1>
      <p>We're heads down and not saying much yet. Want to hear first when we do?</p>
      <a class="mail" href="mailto:hello@d0d.ai">hello@d0d.ai</a>
    </div>
    <div class="chat" aria-label="Simulated chat showing how a question flows through your data">
      <div class="chat-top"><i></i><i></i><i></i>&nbsp;dOd<span>Simulated</span></div>
      <div class="chat-body" id="chat" aria-live="polite"></div>
    </div>
  </div>
</main>
<footer><div class="wrap">© <span id="year"></span> dOd · d0d.ai</div></footer>
<script>
document.getElementById("year").textContent = new Date().getFullYear();

// Simulated conversations. Illustrative only, not real data.
const CONVOS = [
  { q: "Which region grew fastest last quarter?",
    sources: ["s3://sales/*.parquet", "postgres · orders", "crm.csv"],
    steps: ["reading <b>3 sources</b> · 1.2B rows", "plan: last quarter → group by region → growth",
            "<b>48 workers</b> running in parallel", "done in <b>0.8 s</b>"],
    answer: "APAC grew fastest, up 18% on the quarter before.",
    bars: [["APAC", 18], ["EMEA", 11], ["NA", 7], ["LATAM", 4]] },
  { q: "Where are checkout errors coming from today?",
    sources: ["logs/*.gz", "kafka · events", "gcs://traces"],
    steps: ["reading <b>3 sources</b> · 640M lines", "plan: today → errors only → count by service",
            "<b>32 workers</b> running in parallel", "done in <b>0.4 s</b>"],
    answer: "Most come from the payments service, after the 09:40 deploy.",
    bars: [["payments", 62], ["auth", 21], ["cart", 11], ["search", 6]] },
  { q: "Which products do churned customers return most?",
    sources: ["snowflake · returns", "mysql · customers", "tickets.json"],
    steps: ["reading <b>3 sources</b> · 85M rows", "plan: churned customers → join returns → top products",
            "<b>24 workers</b> running in parallel", "done in <b>0.6 s</b>"],
    answer: "Headphones lead returns among churned customers, ahead of chargers.",
    bars: [["headphones", 34], ["chargers", 22], ["cases", 15], ["cables", 9]] }
];

const chat = document.getElementById("chat");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, still ? 0 : ms));
const el = (tag, cls, html = "") => Object.assign(document.createElement(tag), { className: cls, innerHTML: html });

async function play(c) {
  chat.replaceChildren();
  const you = chat.appendChild(el("div", "msg you typing"));
  for (const ch of still ? [c.q] : c.q) { you.textContent += ch; await wait(35); }
  you.classList.remove("typing");
  await wait(400);

  const dod = chat.appendChild(el("div", "msg dod"));
  const srcs = dod.appendChild(el("div", "srcs", c.sources.map(s => `<span class="src">${s}</span>`).join("")));
  const flow = dod.appendChild(el("ul", "flow"));
  for (const s of srcs.children) { await wait(250); s.classList.add("on"); }
  for (const step of c.steps) {
    flow.lastChild?.classList.add("done");
    flow.appendChild(el("li", "", step));
    await wait(700);
  }
  flow.lastChild.classList.add("done");

  const max = Math.max(...c.bars.map(b => b[1]));
  const ans = dod.appendChild(el("div", "answer", `<div class="lead">${c.answer}</div>` +
    c.bars.map(([k, v]) => `<div class="bar"><span>${k}</span><div><span data-w="${v / max * 100}"></span></div><span>${v}%</span></div>`).join("")));
  await wait(50);
  ans.querySelectorAll("[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
}

(async () => {
  if (still) return play(CONVOS[0]);
  for (let i = 0; ; i = (i + 1) % CONVOS.length) { await play(CONVOS[i]); await wait(4500); }
})();
</script>
</body>
</html>
